
name: Build VPNSOPR APK

on:
  push:
    branches:
      - main
    paths:
      - 'VPNSOPR-Android-Complete.zip'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"

          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            test -x "$SDKMANAGER"
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses
            yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          fi

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check source archive
        run: |
          test -f VPNSOPR-Android-Complete.zip

      - name: Extract Android project
        run: |
          unzip -q VPNSOPR-Android-Complete.zip -d build-source
          test -f build-source/VPNSOPR-Android/settings.gradle.kts
          test -f build-source/VPNSOPR-Android/app/build.gradle.kts

      - name: Fix sing-box route prefixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "build-source/VPNSOPR-Android/app/src/main/java/com/vpnsopr/client/LibboxProxyFactory.kt"
          )

          if not path.is_file():
              raise SystemExit("LibboxProxyFactory.kt not found")

          source = path.read_text()

          replacements = {
              "IpPrefix(route4.next())":
                  "route4.next().let { p -> IpPrefix(java.net.InetAddress.getByName(p.address()), p.prefix()) }",
              "IpPrefix(route6.next())":
                  "route6.next().let { p -> IpPrefix(java.net.InetAddress.getByName(p.address()), p.prefix()) }",
              "IpPrefix(exclude4.next())":
                  "exclude4.next().let { p -> IpPrefix(java.net.InetAddress.getByName(p.address()), p.prefix()) }",
              "IpPrefix(exclude6.next())":
                  "exclude6.next().let { p -> IpPrefix(java.net.InetAddress.getByName(p.address()), p.prefix()) }",
          }

          for old, new in replacements.items():
              if old in source:
                  source = source.replace(old, new)
              elif new not in source:
                  raise SystemExit("Unexpected source code: " + old)

          path.write_text(source)
          print("Route prefix compatibility patch applied successfully")
          PY

      - name: Build Debug APK
        working-directory: build-source/VPNSOPR-Android
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VPNSOPR-debug-apk
          path: build-source/VPNSOPR-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
